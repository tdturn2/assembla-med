# Railway — Assembla Med API
# Service settings: Root Directory = repo root (monorepo)

[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @assembla-med/shared build && pnpm --filter @assembla-med/api exec prisma generate && pnpm --filter @assembla-med/api build"

[deploy]
startCommand = "pnpm --filter @assembla-med/api exec prisma migrate deploy && pnpm --filter @assembla-med/api start:prod"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
