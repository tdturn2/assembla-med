# Point API service → Settings → Config-as-code → Railway Config File: railway.api.toml
# This forces Dockerfile builds (ignore Nixpacks/Railpack custom build field).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"

[deploy]
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
